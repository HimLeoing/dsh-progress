name: README statistics
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme-stats.yml'
      - 'scripts/update-readme-stats.mjs'
      - 'scripts/download-series.mjs'
      - 'test/readme-stats.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-statistics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read public statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node test/readme-stats.mjs
          node scripts/update-readme-stats.mjs
      - name: Save updated charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add README.md README.zh-CN.md docs/stats.json docs/assets/npm-downloads*.svg docs/assets/stars*.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='HimLeoing' -c user.email='83563534+HimLeoing@users.noreply.github.com' commit -m 'docs: refresh public project statistics'
          gh auth setup-git
          git push origin HEAD:main
