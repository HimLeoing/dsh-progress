<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">How dsh-progress reads a task</title><desc id="desc">Execution evidence and optional AI observations inform independent task estimates. The main task includes teammate work, integration, and delivery. This is an architecture diagram, not a product screenshot.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b20"/><stop offset="1" stop-color="#24221c"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#c7a34e" stroke-width="1.2"/></marker></defs>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<text x="48" y="54" fill="#d3b25d" font-size="14" letter-spacing="2">HOW IT WORKS · ARCHITECTURE</text>
<text x="48" y="100" fill="#f4f0e5" font-size="30" font-weight="600">One main task. Independent teammate progress.</text>
<g fill="#242628" stroke="#464641" stroke-width="1.5"><rect x="48" y="146" width="300" height="240" rx="16"/><rect x="448" y="146" width="300" height="240" rx="16"/><rect x="848" y="146" width="304" height="240" rx="16"/></g>
<g fill="#d3b25d" font-size="13" letter-spacing="1"><text x="72" y="180">01 · OBSERVE</text><text x="472" y="180">02 · ESTIMATE</text><text x="872" y="180">03 · PRESENT</text></g>
<g fill="#f4f0e5" font-size="22" font-weight="600"><text x="72" y="220">Execution evidence</text><text x="472" y="220">Local by default</text><text x="872" y="220">A clear overview</text></g>
<g fill="#b8b8b0" font-size="17"><text x="72" y="260">Completed steps and outputs</text><text x="72" y="292">Checklists and verification</text><text x="72" y="324">Teammate lifecycle</text><text x="472" y="260">Per-item weighted estimates</text><text x="472" y="292">Independent teammate state</text><text x="472" y="324">Optional AI observations</text><text x="872" y="260">Main task + remaining time</text><text x="872" y="292">Teammates + current activity</text><text x="872" y="324">Details and retained turns</text></g>
<g fill="none" stroke="#c7a34e" stroke-width="2" marker-end="url(#arrow)"><path d="M366 264h60"/><path d="M766 264h60"/></g>
<text x="48" y="425" fill="#97998f" font-size="14">Estimates may change with rework. Only a successful host completion establishes 100%.</text>
</g></svg>
