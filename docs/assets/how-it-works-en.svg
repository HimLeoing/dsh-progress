<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">How task progress becomes visible</title><desc id="desc">Execution evidence → layered estimates → a clear overview</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b20"/><stop offset="1" stop-color="#24221c"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#c7a34e" stroke-width="1.3"/></marker></defs><rect width="1200" height="460" rx="24" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"><text x="42" y="51" fill="#d3b25d" font-size="14" font-weight="600">HOW IT WORKS · ARCHITECTURE</text><text x="42" y="95" fill="#f4f0e5" font-size="29" font-weight="600">How task progress becomes visible</text><text x="42" y="126" fill="#b8b8b0" font-size="16" font-weight="400">Execution evidence → layered estimates → a clear overview</text> <rect x="42" y="156" width="324" height="232" rx="16" fill="#242628" stroke="#464641" stroke-width="1.5"/><text x="64" y="190" fill="#d3b25d" font-size="13" font-weight="600">01 · OBSERVE</text><text x="64" y="229" fill="#f4f0e5" font-size="19" font-weight="600">Execution evidence</text><text x="64" y="269" fill="#b8b8b0" font-size="14" font-weight="400">Steps, tool results, checks</text><text x="64" y="300" fill="#b8b8b0" font-size="14" font-weight="400">Checklists and scope changes</text><text x="64" y="331" fill="#b8b8b0" font-size="14" font-weight="400">Teammate completion and rework</text><path d="M382 272h40" fill="none" stroke="#c7a34e" stroke-width="2" /><rect x="438" y="156" width="324" height="232" rx="16" fill="#242628" stroke="#464641" stroke-width="1.5"/><text x="460" y="190" fill="#d3b25d" font-size="13" font-weight="600">02 · ESTIMATE</text><text x="460" y="229" fill="#f4f0e5" font-size="19" font-weight="600">Local evidence + optional AI</text><text x="460" y="269" fill="#b8b8b0" font-size="14" font-weight="400">Local: stages and completion evidence</text><text x="460" y="300" fill="#b8b8b0" font-size="14" font-weight="400">AI: observations at the chosen cadence</text><text x="460" y="331" fill="#b8b8b0" font-size="14" font-weight="400">Per-item estimates, weighted by scope</text><path d="M778 272h40" fill="none" stroke="#c7a34e" stroke-width="2" /><rect x="834" y="156" width="324" height="232" rx="16" fill="#242628" stroke="#464641" stroke-width="1.5"/><text x="856" y="190" fill="#d3b25d" font-size="13" font-weight="600">03 · PRESENT</text><text x="856" y="229" fill="#f4f0e5" font-size="19" font-weight="600">Main task + teammate views</text><text x="856" y="269" fill="#b8b8b0" font-size="14" font-weight="400">Main task and remaining time</text><text x="856" y="300" fill="#b8b8b0" font-size="14" font-weight="400">Teammate progress and current work</text><text x="856" y="331" fill="#b8b8b0" font-size="14" font-weight="400">Details and previous turns</text><text x="42" y="429" fill="#97998f" font-size="14" font-weight="400">Rework can change estimates. The main task includes teammates, integration and delivery; 100% follows actual completion.</text><g fill="none" stroke="#c7a34e" stroke-width="2"><path d="M415 267l7 5-7 5M811 267l7 5-7 5"/></g></g></svg>