<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">任务进度，怎样被看见</title><desc id="desc">真实执行证据 → 分层估算 → 清晰呈现</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b20"/><stop offset="1" stop-color="#24221c"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#c7a34e" stroke-width="1.3"/></marker></defs><rect width="1200" height="460" rx="24" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"><text x="42" y="51" fill="#d3b25d" font-size="14" font-weight="600">工作原理 · 结构示意</text><text x="42" y="95" fill="#f4f0e5" font-size="29" font-weight="600">任务进度，怎样被看见</text><text x="42" y="126" fill="#b8b8b0" font-size="16" font-weight="400">真实执行证据 → 分层估算 → 清晰呈现</text> <rect x="42" y="156" width="324" height="232" rx="16" fill="#242628" stroke="#464641" stroke-width="1.5"/><text x="64" y="190" fill="#d3b25d" font-size="13" font-weight="600">01 · 观察</text><text x="64" y="229" fill="#f4f0e5" font-size="22" font-weight="600">来自真实执行的证据</text><text x="64" y="269" fill="#b8b8b0" font-size="17" font-weight="400">步骤、工具结果与验证</text><text x="64" y="300" fill="#b8b8b0" font-size="17" font-weight="400">任务清单与新增范围</text><text x="64" y="331" fill="#b8b8b0" font-size="17" font-weight="400">队友完成、续接与返工</text><path d="M382 272h40" fill="none" stroke="#c7a34e" stroke-width="2" /><rect x="438" y="156" width="324" height="232" rx="16" fill="#242628" stroke="#464641" stroke-width="1.5"/><text x="460" y="190" fill="#d3b25d" font-size="13" font-weight="600">02 · 估算</text><text x="460" y="229" fill="#f4f0e5" font-size="22" font-weight="600">本地与 AI，各有依据</text><text x="460" y="269" fill="#b8b8b0" font-size="17" font-weight="400">本地：阶段先验与完成证据</text><text x="460" y="300" fill="#b8b8b0" font-size="17" font-weight="400">AI：按节奏补充进展评估</text><text x="460" y="331" fill="#b8b8b0" font-size="17" font-weight="400">有清单时逐项估算后加权</text><path d="M778 272h40" fill="none" stroke="#c7a34e" stroke-width="2" /><rect x="834" y="156" width="324" height="232" rx="16" fill="#242628" stroke="#464641" stroke-width="1.5"/><text x="856" y="190" fill="#d3b25d" font-size="13" font-weight="600">03 · 呈现</text><text x="856" y="229" fill="#f4f0e5" font-size="22" font-weight="600">一层总览，独立队友</text><text x="856" y="269" fill="#b8b8b0" font-size="17" font-weight="400">主任务进度与剩余时间</text><text x="856" y="300" fill="#b8b8b0" font-size="17" font-weight="400">队友独立进度与当前操作</text><text x="856" y="331" fill="#b8b8b0" font-size="17" font-weight="400">任务详情与历史轮次</text><text x="42" y="429" fill="#97998f" font-size="14" font-weight="400">返工可能改变估计。主任务包含队友工作、整合与交付；真实完成后才显示 100%。</text><g fill="none" stroke="#c7a34e" stroke-width="2"><path d="M415 267l7 5-7 5M811 267l7 5-7 5"/></g></g></svg>